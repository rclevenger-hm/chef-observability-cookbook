---
driver:
  name: vagrant
provisioner:
  name: chef_zero
  product_name: chef
  product_version: '18'
  chef_license: accept-no-persist
  always_update_cookbooks: true
  multiple_converge: 2
  enforce_idempotency: true
verifier:
  name: inspec
platforms:
  - name: ubuntu-22.04
    driver:
      box: bento/ubuntu-22.04
  - name: rocky-9
    driver:
      box: bento/rockylinux-9
suites:
  - name: default
    run_list:
      - recipe[observability::default]
    verifier:
      inspec_tests:
        - test/integration/default
